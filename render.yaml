# Render Blueprint：一条 yaml 建出「单服务容器 + 持久卷」。
#
# 用法：Render 控制台 → New → Blueprint → 选这个仓库。
# 仓库根目录就是构建上下文，不需要设置 Root Directory。
#
# 数据库不在这里建：Render 免费 Postgres 30 天到期就删库，不适合当长期方案。
# 用 Neon（永久免费 0.5GB），建好后把连接串粘到 DATABASE_URL。
#
# 单服务模式：同一个容器同时提供前端页面和 API，只需要一个 URL，不用配 CORS。

services:
  - type: web
    name: qicheng
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    # free：$0，但 512MB 内存 + 15 分钟无访问休眠（冷启动约 1 分钟）+ 不能挂盘，
    #       每次重启上传的附件全部丢失。只适合给人看个样子。
    # starter：$7/月，不休眠、可挂盘，附件能活下来。
    plan: starter
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: qicheng-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        sync: false # Neon 连接串，创建时手填
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      - key: SECRET_KEY
        generateValue: true # Render 自动生成随机串
      # 单服务同源，本来不需要 CORS；留着通配符不影响
      - key: CORS_ORIGINS
        value: "*"
      - key: EMBEDDING_PROVIDER
        value: local
      - key: DB_ECHO
        value: "false"
