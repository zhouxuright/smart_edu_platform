# Render Blueprint：一条 yaml 建出「后端容器 + 持久卷」。
#
# 用法：Render 控制台 → New → Blueprint → 选这个仓库。
# 注意先把服务的 Root Directory 指到 backend（下面 rootDir 已声明）。
#
# 数据库不在这里建：Render 免费 Postgres 30 天到期就删库，不适合当长期方案。
# 用 Neon（永久免费 0.5GB），建好后把连接串粘到 DATABASE_URL。

services:
  - type: web
    name: qicheng-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    # free：$0，但 512MB 内存 + 15 分钟无访问休眠（冷启动约 1 分钟）+ 不能挂盘，
    #       每次重启上传的附件全部丢失。只适合给人看个样子。
    # starter：$7/月，不休眠、可挂盘，附件能活下来。
    plan: starter
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: qicheng-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        sync: false # Neon 连接串，创建时手填
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      - key: SECRET_KEY
        generateValue: true # Render 自动生成随机串
      - key: CORS_ORIGINS
        sync: false # 填 Vercel 域名，如 https://qicheng.vercel.app
      - key: EMBEDDING_PROVIDER
        value: local
      - key: DB_ECHO
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
