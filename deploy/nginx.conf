
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # HTTPS Server Block
    server {
        listen 443 ssl;
        server_name your_domain.com;  # Replace with your actual domain

        ssl_certificate /etc/nginx/ssl/your_domain.crt;       # Replace with your actual certificate path
        ssl_certificate_key /etc/nginx/ssl/your_domain.key;   # Replace with your actual key path
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # WebSocket Proxy Configuration
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;  # Longer timeout for long-running sessions
        }

        # API Proxy Configuration
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Files (Frontend) - Optional if serving static files
        # location / {
        #     root /var/www/html;
        #     index index.html;
        #     try_files $uri $uri/ /index.html;
        # }
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name your_domain.com;
        return 301 https://$host$request_uri;
    }
}
